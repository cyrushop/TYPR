<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>客廳音響布局 3D 模型（離線版）</title>
<style>
  :root{
    --bg:#141516; --panel:rgba(24,25,27,.9); --panel-solid:#1c1d20; --line:rgba(255,255,255,.1);
    --text:#ebe8e2; --muted:#a7a39b; --accent:#e3ac5c; --accent-ink:#1b1408;
    --ok:#7cc79a; --warn:#f0b14a; --bad:#ef7a6b; --info:#8fbfe0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;font-size:14px;overflow:hidden}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}
  #stage{position:relative;flex:1;min-height:0;display:flex}
  #viewport{position:relative;flex:1;min-width:0;touch-action:none}
  #viewport canvas{display:block;width:100%;height:100%;outline:none}
  /* 頂部狀態 */
  #status{position:absolute;left:12px;top:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
  .chip{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;color:var(--muted);backdrop-filter:blur(6px)}
  .chip b{color:var(--text);font-weight:600}
  .chip.warn{color:var(--warn);border-color:rgba(240,177,74,.35)}
  /* 工具列 */
  #toolbar{display:flex;gap:6px;align-items:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    background:var(--panel-solid);border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:thin;flex-shrink:0}
  .grp{display:flex;gap:4px;align-items:center;padding-right:8px;margin-right:2px;border-right:1px solid var(--line);flex-shrink:0}
  .grp:last-child{border-right:0}
  .grp-label{font-size:11px;color:var(--muted);margin-right:2px;white-space:nowrap}
  button,select{font:inherit;color:var(--text);background:#2a2c30;border:1px solid #3a3d42;border-radius:8px;padding:7px 11px;cursor:pointer;white-space:nowrap;min-height:34px}
  button:hover{background:#33363b}
  button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
  button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  /* 側面板 */
  #panel{width:360px;flex-shrink:0;background:var(--panel-solid);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  #panel.hidden{display:none}
  .tabs{display:flex;border-bottom:1px solid var(--line);flex-shrink:0}
  .tabs button{flex:1;border:0;border-radius:0;background:transparent;color:var(--muted);padding:11px 4px;border-bottom:2px solid transparent}
  .tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
  .tab-body{overflow:auto;padding:12px 14px 24px;flex:1;min-height:0}
  .tab-body h3{font-size:13px;margin:16px 0 6px;color:var(--accent);font-weight:600}
  .tab-body h3:first-child{margin-top:2px}
  .row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);align-items:baseline}
  .row .k{color:var(--muted)} .row .v{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
  .note{font-size:12px;color:var(--muted);line-height:1.55;margin:4px 0 0}
  .msg{border-left:3px solid var(--info);background:rgba(143,191,224,.08);padding:7px 9px;margin:7px 0;border-radius:0 6px 6px 0;line-height:1.55;font-size:13px}
  .msg.warn{border-color:var(--warn);background:rgba(240,177,74,.08)}
  .msg.bad{border-color:var(--bad);background:rgba(239,122,107,.09)}
  .msg.ok{border-color:var(--ok);background:rgba(124,199,154,.08)}
  .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;margin-left:6px;vertical-align:1px}
  .tag.u{background:rgba(240,177,74,.18);color:var(--warn)} .tag.c{background:rgba(124,199,154,.15);color:var(--ok)}
  ul.plain{margin:4px 0;padding-left:18px;line-height:1.6} ul.plain li{margin:3px 0}
  .objrow{padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .objrow:hover{color:#fff}
  .objrow small{display:block;color:var(--muted);font-variant-numeric:tabular-nums}
  /* 物件資料卡 */
  #info{position:absolute;left:12px;bottom:12px;max-width:min(380px,calc(100% - 24px));background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:12px 14px;backdrop-filter:blur(8px);display:none;line-height:1.55}
  #info h4{margin:0 22px 6px 0;font-size:15px}
  #info .close{position:absolute;right:6px;top:6px;min-height:0;padding:3px 9px;background:transparent;border:0;color:var(--muted);font-size:18px}
  /* 行走搖桿 */
  #joy{position:absolute;left:22px;bottom:22px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);display:none;touch-action:none}
  #joy i{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(227,172,92,.75)}
  #walkhint{position:absolute;right:12px;bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--muted);display:none;max-width:260px;line-height:1.5}
  /* 覆蓋層 */
  .overlay{position:fixed;inset:0;background:rgba(8,8,9,.72);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
  .overlay.show{display:flex}
  .dialog{background:var(--panel-solid);border:1px solid var(--line);border-radius:14px;padding:18px 20px;max-width:880px;width:100%;max-height:100%;overflow:auto;line-height:1.6}
  .dialog h2{margin:0 0 8px;font-size:17px}
  .drop{border:2px dashed #4a4d52;border-radius:12px;padding:26px;text-align:center;margin:12px 0;color:var(--muted)}
  .drop.over{border-color:var(--accent);color:var(--text)}
  .shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin:12px 0}
  .shots figure{margin:0;background:#101112;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .shots img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
  .shots figcaption{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;font-size:12px;gap:6px}
  .shots a{color:var(--accent)}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);z-index:5;background:var(--bg)}
  @media (max-width: 820px){
    #stage{flex-direction:column}
    #panel{width:auto;height:42%;border-left:0;border-top:1px solid var(--line)}
    #status{top:8px;left:8px;right:8px}
    .chip{font-size:11px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="viewport">
      <div id="status"></div>
      <div id="info" role="dialog" aria-live="polite"></div>
      <div id="joy" aria-hidden="true"><i></i></div>
      <div id="walkhint"></div>
    </div>
    <aside id="panel">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="check" aria-selected="true">可行性檢查</button>
        <button role="tab" data-tab="todo" aria-selected="false">待確認</button>
        <button role="tab" data-tab="list" aria-selected="false">物件</button>
      </div>
      <div class="tab-body" id="tab-check"></div>
      <div class="tab-body" id="tab-todo" hidden></div>
      <div class="tab-body" id="tab-list" hidden></div>
    </aside>
  </div>
  <nav id="toolbar">
    <div class="grp" id="grp-views"><span class="grp-label">視角</span></div>
    <div class="grp">
      <button id="btn-walk" aria-pressed="false">第一身行走</button>
    </div>
    <div class="grp"><span class="grp-label">顯示</span>
      <button id="btn-screen" aria-pressed="false">落幕</button>
      <button id="btn-dims" aria-pressed="false">尺寸標示</button>
      <button id="btn-tri" aria-pressed="false">聆聽三角</button>
      <button id="btn-beam" aria-pressed="false">投影光束</button>
      <button id="btn-unc" aria-pressed="true">未確認標示</button>
    </div>
    <div class="grp"><span class="grp-label">方案</span>
      <button id="btn-planA" aria-pressed="true">梳化靠窗</button>
      <button id="btn-planB" aria-pressed="false">梳化離窗 0.35 m</button>
    </div>
    <div class="grp"><span class="grp-label">截圖</span>
      <button id="btn-shots" class="primary">全部預設視角</button>
      <button id="btn-shot1">目前畫面</button>
      <select id="sel-res" aria-label="截圖解像度">
        <option value="1920x1080">1920×1080</option>
        <option value="2560x1440">2560×1440</option>
        <option value="3840x2160">3840×2160</option>
      </select>
      <label class="grp-label" style="display:flex;gap:4px;align-items:center"><input type="checkbox" id="chk-clean" checked>不含標示</label>
    </div>
    <div class="grp">
      <button id="btn-load">載入 JSON</button>
      <button id="btn-panel" aria-pressed="true">資料面板</button>
    </div>
  </nav>
</div>

<div class="overlay" id="loader">
  <div class="dialog">
    <h2>載入 scene-data.json</h2>
    <p class="note" id="loader-msg">瀏覽器未能自動讀取同一資料夾內的 scene-data.json（直接以檔案方式開啟網頁時，瀏覽器會封鎖讀取）。請選擇該檔案，或把檔案拖放到下方。</p>
    <div class="drop" id="drop">把 scene-data.json 拖放到這裏<br><br><input type="file" id="file" accept=".json,application/json"></div>
    <p class="note">另一做法：在此資料夾執行 <code>python3 -m http.server 8000</code>，再開啟 http://localhost:8000 ，修改 JSON 後重新整理即可更新；或直接開啟 dist 資料夾內的離線版。</p>
    <div style="text-align:right"><button id="loader-cancel" hidden>取消</button></div>
  </div>
</div>

<div class="overlay" id="shots-dlg">
  <div class="dialog">
    <h2>截圖</h2>
    <p class="note" id="shots-msg"></p>
    <div class="shots" id="shots"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">
      <button id="shots-all" class="primary">全部下載</button>
      <button id="shots-close">關閉</button>
    </div>
  </div>
</div>

<div id="boot">正在載入 3D 引擎……</div>
