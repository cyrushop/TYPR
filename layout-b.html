<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>客廳音響橫向方案</title>
<style>
  :root{
    --bg:#141516; --panel:rgba(24,25,27,.9); --panel-solid:#1c1d20; --line:rgba(255,255,255,.1);
    --text:#ebe8e2; --muted:#a7a39b; --accent:#e3ac5c; --accent-ink:#1b1408;
    --ok:#7cc79a; --warn:#f0b14a; --bad:#ef7a6b; --info:#8fbfe0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;font-size:14px;overflow:hidden}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}
  #stage{position:relative;flex:1;min-height:0;display:flex}
  #viewport{position:relative;flex:1;min-width:0;touch-action:none}
  #viewport canvas{display:block;width:100%;height:100%;outline:none}
  /* 頂部狀態 */
  #status{position:absolute;left:12px;top:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
  .chip{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;color:var(--muted);backdrop-filter:blur(6px)}
  .chip b{color:var(--text);font-weight:600}
  .chip.warn{color:var(--warn);border-color:rgba(240,177,74,.35)}
  /* 工具列 */
  #toolbar{display:flex;gap:6px;align-items:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    background:var(--panel-solid);border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:thin;flex-shrink:0}
  .grp{display:flex;gap:4px;align-items:center;padding-right:8px;margin-right:2px;border-right:1px solid var(--line);flex-shrink:0}
  .grp:last-child{border-right:0}
  .grp-label{font-size:11px;color:var(--muted);margin-right:2px;white-space:nowrap}
  button,select{font:inherit;color:var(--text);background:#2a2c30;border:1px solid #3a3d42;border-radius:8px;padding:7px 11px;cursor:pointer;white-space:nowrap;min-height:34px}
  button:hover{background:#33363b}
  button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
  button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  /* 側面板 */
  #panel{width:360px;flex-shrink:0;background:var(--panel-solid);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  #panel.hidden{display:none}
  .tabs{display:flex;border-bottom:1px solid var(--line);flex-shrink:0}
  .tabs button{flex:1;border:0;border-radius:0;background:transparent;color:var(--muted);padding:11px 4px;border-bottom:2px solid transparent}
  .tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
  .tab-body{overflow:auto;padding:12px 14px 24px;flex:1;min-height:0}
  .tab-body h3{font-size:13px;margin:16px 0 6px;color:var(--accent);font-weight:600}
  .tab-body h3:first-child{margin-top:2px}
  .row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);align-items:baseline}
  .row .k{color:var(--muted)} .row .v{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
  .note{font-size:12px;color:var(--muted);line-height:1.55;margin:4px 0 0}
  .msg{border-left:3px solid var(--info);background:rgba(143,191,224,.08);padding:7px 9px;margin:7px 0;border-radius:0 6px 6px 0;line-height:1.55;font-size:13px}
  .msg.warn{border-color:var(--warn);background:rgba(240,177,74,.08)}
  .msg.bad{border-color:var(--bad);background:rgba(239,122,107,.09)}
  .msg.ok{border-color:var(--ok);background:rgba(124,199,154,.08)}
  .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;margin-left:6px;vertical-align:1px}
  .tag.u{background:rgba(240,177,74,.18);color:var(--warn)} .tag.c{background:rgba(124,199,154,.15);color:var(--ok)}
  ul.plain{margin:4px 0;padding-left:18px;line-height:1.6} ul.plain li{margin:3px 0}
  .objrow{padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .objrow:hover{color:#fff}
  .objrow small{display:block;color:var(--muted);font-variant-numeric:tabular-nums}
  /* 物件資料卡 */
  #info{position:absolute;left:12px;bottom:12px;max-width:min(380px,calc(100% - 24px));background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:12px 14px;backdrop-filter:blur(8px);display:none;line-height:1.55}
  #info h4{margin:0 22px 6px 0;font-size:15px}
  #info .close{position:absolute;right:6px;top:6px;min-height:0;padding:3px 9px;background:transparent;border:0;color:var(--muted);font-size:18px}
  /* 行走搖桿 */
  #joy{position:absolute;left:22px;bottom:22px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);display:none;touch-action:none}
  #joy i{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(227,172,92,.75)}
  #walkhint{position:absolute;right:12px;bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--muted);display:none;max-width:260px;line-height:1.5}
  /* 覆蓋層 */
  .overlay{position:fixed;inset:0;background:rgba(8,8,9,.72);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
  .overlay.show{display:flex}
  .dialog{background:var(--panel-solid);border:1px solid var(--line);border-radius:14px;padding:18px 20px;max-width:880px;width:100%;max-height:100%;overflow:auto;line-height:1.6}
  .dialog h2{margin:0 0 8px;font-size:17px}
  .drop{border:2px dashed #4a4d52;border-radius:12px;padding:26px;text-align:center;margin:12px 0;color:var(--muted)}
  .drop.over{border-color:var(--accent);color:var(--text)}
  .shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin:12px 0}
  .shots figure{margin:0;background:#101112;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .shots img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
  .shots figcaption{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;font-size:12px;gap:6px}
  .shots a{color:var(--accent)}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);z-index:5;background:var(--bg)}
  @media (max-width: 820px){
    #stage{flex-direction:column}
    #panel{width:auto;height:42%;border-left:0;border-top:1px solid var(--line)}
    #status{top:8px;left:8px;right:8px}
    .chip{font-size:11px}
  }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="viewport">
      <div id="status"></div>
      <div id="info" role="dialog" aria-live="polite"></div>
      <div id="joy" aria-hidden="true"><i></i></div>
      <div id="walkhint"></div>
    </div>
    <aside id="panel">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="check" aria-selected="true">可行性檢查</button>
        <button role="tab" data-tab="todo" aria-selected="false">待確認</button>
        <button role="tab" data-tab="list" aria-selected="false">物件</button>
      </div>
      <div class="tab-body" id="tab-check"></div>
      <div class="tab-body" id="tab-todo" hidden></div>
      <div class="tab-body" id="tab-list" hidden></div>
    </aside>
  </div>
  <nav id="toolbar">
    <div class="grp" id="grp-views"><span class="grp-label">視角</span></div>
    <div class="grp">
      <button id="btn-walk" aria-pressed="false">第一身行走</button>
    </div>
    <div class="grp"><span class="grp-label">顯示</span>
      <button id="btn-screen" aria-pressed="false">落幕</button>
      <button id="btn-dims" aria-pressed="false">尺寸標示</button>
      <button id="btn-tri" aria-pressed="false">聆聽三角</button>
      <button id="btn-beam" aria-pressed="false">投影光束</button>
      <button id="btn-unc" aria-pressed="true">未確認標示</button>
    </div>
    <div class="grp"><span class="grp-label">方案</span>
      <button id="btn-planA" aria-pressed="true">方案 A</button>
      <button id="btn-planB" aria-pressed="false">方案 B</button>
    </div>
    <div class="grp"><span class="grp-label">截圖</span>
      <button id="btn-shots" class="primary">全部預設視角</button>
      <button id="btn-shot1">目前畫面</button>
      <select id="sel-res" aria-label="截圖解像度">
        <option value="1920x1080">1920×1080</option>
        <option value="2560x1440">2560×1440</option>
        <option value="3840x2160">3840×2160</option>
      </select>
      <label class="grp-label" style="display:flex;gap:4px;align-items:center"><input type="checkbox" id="chk-clean" checked>不含標示</label>
    </div>
    <div class="grp">
      <button id="btn-load">載入 JSON</button>
      <button id="btn-panel" aria-pressed="true">資料面板</button>
    </div>
  </nav>
</div>

<div class="overlay" id="loader">
  <div class="dialog">
    <h2>載入 scene-data-b.json</h2>
    <p class="note" id="loader-msg">瀏覽器未能自動讀取同一資料夾內的 scene-data-b.json（直接以檔案方式開啟網頁時，瀏覽器會封鎖讀取）。請選擇該檔案，或把檔案拖放到下方。</p>
    <div class="drop" id="drop">把 scene-data-b.json 拖放到這裏<br><br><input type="file" id="file" accept=".json,application/json"></div>
    <p class="note">另一做法：在此資料夾執行 <code>python3 -m http.server 8000</code>，再開啟 http://localhost:8000 ，修改 JSON 後重新整理即可更新；或直接開啟 dist 資料夾內的離線版。</p>
    <div style="text-align:right"><button id="loader-cancel" hidden>取消</button></div>
  </div>
</div>

<div class="overlay" id="shots-dlg">
  <div class="dialog">
    <h2>截圖</h2>
    <p class="note" id="shots-msg"></p>
    <div class="shots" id="shots"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">
      <button id="shots-all" class="primary">全部下載</button>
      <button id="shots-close">關閉</button>
    </div>
  </div>
</div>

<div id="boot">正在載入 3D 引擎……</div>

<script type="module" id="app-script">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* =========================================================================
   座標：資料（JSON）使用 x＝闊度、y＝長度（由窗牆起計）、z＝高度。
   three.js：X＝x、Y＝z（高度）、Z＝y（長度）。以下 P() 負責轉換。
   所有尺寸及位置一律由 scene-data-b.json 讀入；程式只定義外觀細節的比例。
   ========================================================================= */
const P = (x, y, z) => new THREE.Vector3(x, z, y);
const $ = (s) => document.querySelector(s);
const fmt = (v, n = 2) => (Math.round(v * 10 ** n) / 10 ** n).toFixed(n);
const cm = (v) => `${Math.round(v * 1000) / 10}`;
const deg = (r) => (r * 180) / Math.PI;

function safeGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function safeSet(k, v) { try { localStorage.setItem(k, v); } catch { /* 私密模式等 */ } }
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

/* ------------------------------ 資料載入 ------------------------------ */
let dataSource = '';
function pickJSON(cancellable) {
  return new Promise((resolve, reject) => {
    const ov = $('#loader'), drop = $('#drop'), file = $('#file'), cancel = $('#loader-cancel');
    ov.classList.add('show'); cancel.hidden = !cancellable;
    const done = (txt, name) => {
      try {
        const d = JSON.parse(txt);
        if (!d.objects || !d.room) throw new Error('缺少 room 或 objects');
        safeSet('sceneDataCacheB', JSON.stringify({ time: new Date().toLocaleString('zh-HK'), name, data: d }));
        ov.classList.remove('show'); cleanup(); resolve(d);
      } catch (e) { $('#loader-msg').textContent = `未能讀取：${e.message}。請確認選擇的是 scene-data-b.json。`; }
    };
    const read = (f) => { if (f) f.text().then((t) => done(t, f.name)); };
    const onChange = () => read(file.files[0]);
    const onOver = (e) => { e.preventDefault(); drop.classList.add('over'); };
    const onLeave = () => drop.classList.remove('over');
    const onDrop = (e) => { e.preventDefault(); onLeave(); read(e.dataTransfer.files[0]); };
    const onCancel = () => { ov.classList.remove('show'); cleanup(); reject(new Error('cancel')); };
    function cleanup() { file.value = ''; file.removeEventListener('change', onChange); drop.removeEventListener('dragover', onOver); drop.removeEventListener('dragleave', onLeave); drop.removeEventListener('drop', onDrop); cancel.removeEventListener('click', onCancel); }
    file.addEventListener('change', onChange); drop.addEventListener('dragover', onOver); drop.addEventListener('dragleave', onLeave); drop.addEventListener('drop', onDrop); cancel.addEventListener('click', onCancel);
  });
}
async function loadData() {
  if (window.__SCENE_DATA__) { dataSource = '離線版內嵌資料'; return window.__SCENE_DATA__; }
  try {
    const res = await fetch('scene-data-b.json', { cache: 'no-store' });
    if (!res.ok) throw new Error(String(res.status));
    dataSource = 'scene-data-b.json';
    return await res.json();
  } catch {
    const cached = safeGet('sceneDataCacheB');
    if (cached) { try { const c = JSON.parse(cached); dataSource = `上次手動載入的 JSON（${c.time}）`; return c.data; } catch { /* 忽略 */ } }
    $('#boot').style.display = 'none';
    const d = await pickJSON(false); dataSource = '手動載入的 JSON'; return d;
  }
}

/* ------------------------------ 渲染器 ------------------------------ */
const viewport = $('#viewport');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
viewport.prepend(renderer.domElement);
const maxAniso = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111214);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.22;

const camera = new THREE.PerspectiveCamera(50, 1, 0.03, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 0.15; controls.maxDistance = 30;
controls.screenSpacePanning = true;

/* ------------------------------ 程序貼圖 ------------------------------ */
function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = maxAniso;
  return t;
}
function clouds(g, w, h, r, n, col, a) {
  for (let i = 0; i < n; i++) {
    const x = r() * w, y = r() * h, rad = (0.08 + r() * 0.3) * Math.max(w, h);
    const gr = g.createRadialGradient(x, y, 0, x, y, rad);
    gr.addColorStop(0, `rgba(${col},${a * r()})`); gr.addColorStop(1, `rgba(${col},0)`);
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
  }
}
function veins(g, w, h, r, n, col, a, lw) {
  g.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    let x = r() * w, y = r() < 0.5 ? 0 : r() * h;
    const ang0 = r() * Math.PI * 2; let ang = ang0;
    const steps = 40 + r() * 80, seg = Math.max(w, h) / 70;
    g.strokeStyle = `rgba(${col},${a * (0.4 + r() * 0.6)})`; g.lineWidth = lw * (0.5 + r());
    g.beginPath(); g.moveTo(x, y);
    for (let s = 0; s < steps; s++) {
      ang += (r() - 0.5) * 0.9; ang = ang * 0.8 + ang0 * 0.2;
      x += Math.cos(ang) * seg; y += Math.sin(ang) * seg; g.lineTo(x, y);
      if (r() < 0.03) { g.stroke(); g.lineWidth *= 0.6; g.beginPath(); g.moveTo(x, y); }
    }
    g.stroke();
  }
}
const TEX = {};
function buildTextures() {
  // 牆板：一塊 1.2 m 闊、由地至天花；深灰帶淡白雲石紋，邊緣有細縫
  TEX.wall = canvasTex(512, 1024, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, w, h); gr.addColorStop(0, '#5a5d61'); gr.addColorStop(1, '#4d5054');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    const r = rng(7); clouds(g, w, h, r, 26, '255,255,255', 0.05); clouds(g, w, h, r, 16, '0,0,0', 0.08);
    veins(g, w, h, r, 3, '235,235,235', 0.55, 1.6);
    g.fillStyle = 'rgba(15,15,16,.9)'; g.fillRect(0, 0, 3, h);
  });
  // 地台：淺灰雲石紋，0.6 × 1.2 m 大階磚（一張貼圖包含兩塊）
  TEX.floor = canvasTex(1024, 1024, (g, w, h) => {
    g.fillStyle = '#d3d1cc'; g.fillRect(0, 0, w, h);
    const r = rng(11); clouds(g, w, h, r, 60, '160,158,154', 0.22); clouds(g, w, h, r, 30, '255,255,255', 0.25);
    veins(g, w, h, r, 9, '140,138,135', 0.45, 1.4);
    g.fillStyle = 'rgba(150,147,142,.9)'; g.fillRect(0, 0, w, 2); g.fillRect(0, 0, 2, h); g.fillRect(w / 2 - 1, 0, 2, h);
  });
  TEX.wood = canvasTex(512, 512, (g, w, h) => {
    g.fillStyle = '#3e2c22'; g.fillRect(0, 0, w, h); const r = rng(3);
    for (let i = 0; i < 160; i++) {
      const y = r() * h; g.strokeStyle = `rgba(${r() < 0.5 ? '90,64,46' : '30,20,14'},${0.25 + r() * 0.35})`; g.lineWidth = 0.6 + r() * 2;
      g.beginPath(); for (let x = 0; x <= w; x += 16) g.lineTo(x, y + Math.sin(x / (40 + r() * 30) + i) * 3); g.stroke();
    }
  });
  TEX.walnut = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = '#6b4a2f'; g.fillRect(0, 0, w, h); const r = rng(5);
    for (let i = 0; i < 70; i++) { const y = r() * h; g.strokeStyle = `rgba(40,24,12,${0.2 + r() * 0.3})`; g.lineWidth = 0.5 + r() * 1.5; g.beginPath(); g.moveTo(0, y); g.bezierCurveTo(w / 3, y + 6 * (r() - 0.5), (2 * w) / 3, y + 6 * (r() - 0.5), w, y); g.stroke(); }
  });
  TEX.cloth = canvasTex(1024, 1024, (g, w, h) => {
    g.fillStyle = '#4a4a50'; g.fillRect(0, 0, w, h); const r = rng(19);
    clouds(g, w, h, r, 30, '0,0,0', 0.18); veins(g, w, h, r, 8, '220,220,224', 0.55, 1.4);
  });
  TEX.curtainBump = canvasTex(64, 512, (g, w, h) => {
    const r = rng(23); g.fillStyle = '#808080'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 900; i++) { g.fillStyle = `rgba(${r() < 0.5 ? 255 : 0},${r() < 0.5 ? 255 : 0},${r() < 0.5 ? 255 : 0},.06)`; g.fillRect(r() * w, r() * h, 1, 2 + r() * 4); }
  }, false);
  TEX.brushed = canvasTex(256, 64, (g, w, h) => {
    g.fillStyle = '#c8c9cb'; g.fillRect(0, 0, w, h); const r = rng(29);
    for (let i = 0; i < 300; i++) { const v = r() < 0.5 ? 255 : 90; g.fillStyle = `rgba(${v},${v},${v},.1)`; g.fillRect(0, r() * h, w, 1); }
  });
}

/* ------------------------------ 材質 ------------------------------ */
const MAT = {};
const std = (color, roughness = 0.5, metalness = 0, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness, metalness, ...extra });
const phys = (color, roughness = 0.5, extra = {}) => new THREE.MeshPhysicalMaterial({ color, roughness, ...extra });
const matCache = new Map();
function colorMat(key, make) { if (!matCache.has(key)) matCache.set(key, make()); return matCache.get(key); }
function buildMaterials() {
  Object.assign(MAT, {

// 在 parent（局部座標：X 闊、Y 高、Z 深）放一個方塊；x0,y0,z0 為最小角
function box(parent, mat, x0, y0, z0, w, h, d, r = 0, shadow = true) {
  const geo = r > 0 ? new RoundedBoxGeometry(w, h, d, 2, Math.min(r, w / 2 - 1e-4, h / 2 - 1e-4, d / 2 - 1e-4)) : new THREE.BoxGeometry(w, h, d);
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x0 + w / 2, y0 + h / 2, z0 + d / 2);
  m.castShadow = shadow; m.receiveShadow = true;
  parent.add(m); return m;
}
function mesh(parent, geo, mat, x, y, z, shadow = true) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = shadow; m.receiveShadow = true; parent.add(m); return m;
}
function cylY(parent, mat, cx, y0, cz, r, h, seg = 20) { return mesh(parent, new THREE.CylinderGeometry(r, r, h, seg), mat, cx, y0 + h / 2, cz); }

function label(text, { color = '#ffffff', bg = 'rgba(18,19,21,.86)', size = 0.034, border = null } = {}) {
  const fs = 44, pad = 16, c = document.createElement('canvas'), g = c.getContext('2d');
  const font = `600 ${fs}px "Noto Sans TC","PingFang TC","Microsoft JhengHei","WenQuanYi Zen Hei",sans-serif`;
  g.font = font; const tw = Math.ceil(g.measureText(text).width);
  c.width = tw + pad * 2; c.height = fs + pad * 1.3;
  g.font = font; g.fillStyle = bg; g.beginPath(); g.roundRect(0, 0, c.width, c.height, c.height / 2.6); g.fill();
  if (border) { g.strokeStyle = border; g.lineWidth = 4; g.stroke(); }
  g.fillStyle = color; g.textBaseline = 'middle'; g.fillText(text, pad, c.height / 2 + 2);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: false, depthWrite: false, sizeAttenuation: false, transparent: true }));
  s.scale.set((size * c.width) / c.height, size, 1); s.renderOrder = 30; s.userData.isLabel = true;
  return s;
}

  const leatherDk = colorMat('leatherDk' + o.color, () => { const m = leather.clone(); m.color.multiplyScalar(0.9); return m; });
  const arm = Math.min(0.24, w * 0.09), base = 0.07;

function parseContents(s) { const m = {}; (s || '').split(/[；;]/).forEach((p) => { const r = p.match(/^\s*(上|中|下)[：:]\s*(.+)$/); if (r) m[r[1]] = r[2].trim(); }); return m; }
function equipKind(s) { if (/外露真空管|膽前級/.test(s)) return 'tubePre'; if (/Ref\s*150|膽後級|後級/.test(s)) return 'bigAmp'; if (/黑色/.test(s)) return 'black'; return 'silver'; }
function buildEquipment(g, kind, x0, y0, z0, w, h, d, seed) {
  const r = rng(seed);
  if (kind === 'tubePre') {
    const ch = Math.min(0.08, h * 0.45);
    box(g, MAT.silver, x0, y0, z0, w, ch, d, 0.004);
    box(g, MAT.blackMetal, x0 + w * 0.62, y0 + ch, z0 + d * 0.55, w * 0.3, Math.min(0.09, h - ch), d * 0.35, 0.006);
    const th = Math.min(0.11, h - ch - 0.005);
    for (let i = 0; i < 4; i++) {
      const tx = x0 + 0.06 + i * 0.065, tz = z0 + d * 0.3;
      cylY(g, MAT.glass, tx, y0 + ch, tz, 0.017, th, 16);
      cylY(g, MAT.tubeGlow, tx, y0 + ch + 0.015, tz, 0.006, th * 0.45, 8);
    }
    const k = new THREE.CylinderGeometry(0.012, 0.012, 0.016, 16); k.rotateX(Math.PI / 2);
    [0.2, 0.8].forEach((f) => mesh(g, k, MAT.chrome, x0 + w * f, y0 + ch / 2, z0 - 0.006, false));
    return;
  }
  const body = kind === 'black' ? MAT.blackMetal : MAT.silver;
  box(g, kind === 'black' ? MAT.blackMetal : MAT.gunmetal, x0 + 0.01, y0, z0 + 0.012, w - 0.02, h, d - 0.012, 0.004); // 機身
  box(g, body, x0, y0, z0, w, h, 0.014, 0.003);                                                                    // 面板
  if (kind === 'bigAmp') {
    [x0 + 0.025, x0 + w - 0.045].forEach((x) => { box(g, MAT.black, x, y0 + h * 0.15, z0 - 0.0, 0.02, h * 0.7, 0.002, 0, false); });
    box(g, MAT.amberDisp, x0 + w / 2 - 0.05, y0 + h * 0.62, z0 - 0.001, 0.1, 0.025, 0.002, 0, false);
  } else {
    box(g, r() < 0.5 ? MAT.display : MAT.amberDisp, x0 + w * 0.3, y0 + h * 0.45, z0 - 0.001, w * 0.32, Math.min(0.03, h * 0.25), 0.002, 0, false);
    const k = new THREE.CylinderGeometry(0.018, 0.018, 0.02, 24); k.rotateX(Math.PI / 2);
    mesh(g, k, MAT.chrome, x0 + w * 0.82, y0 + h / 2, z0 - 0.008, false);
    mesh(g, k, MAT.chrome, x0 + w * 0.15, y0 + h / 2, z0 - 0.008, false);
  }
}

function buildRack(g, o) {
  const { w, d, h } = o, shelfT = 0.025, spike = 0.04, post = 0.016, inset = 0.03;
  const shelves = [0.05, 0.34, 0.63].map((f) => (f / 0.88) * h); // 層板高度按器材最高點 h 等比例
  const shelfMat = colorMat('shelf' + o.color, () => phys(o.color, 0.25, { clearcoat: 0.6 }));
  shelves.forEach((y) => box(g, shelfMat, 0, y, 0, w, shelfT, d, 0.004));
  const postTop = shelves[2] + shelfT + 0.02;
  [[inset, inset], [w - inset, inset], [inset, d - inset], [w - inset, d - inset]].forEach(([x, z]) => {
    cylY(g, MAT.steel, x, spike, z, post, postTop - spike, 16);
    const c = new THREE.ConeGeometry(post * 0.9, spike, 16); c.rotateX(Math.PI); mesh(g, c, MAT.steel, x, spike / 2, z);
  });
  const cont = parseContents(o.contents), ew = w - 2 * inset - 0.05, ed = d - 0.1, ex = (w - ew) / 2, ez = 0.05;
  const tops = [shelves[0] + shelfT, shelves[1] + shelfT, shelves[2] + shelfT];
  const spaceH = [shelves[1] - tops[0] - 0.02, shelves[2] - tops[1] - 0.02, h - tops[2]];
  ['下', '中', '上'].forEach((lv, i) => {
    const s = cont[lv]; if (!s) return; const kind = equipKind(s);
    const eh = i === 2 ? spaceH[2] : kind === 'bigAmp' ? spaceH[i] * 0.85 : kind === 'tubePre' ? spaceH[i] * 0.8 : Math.min(0.15, spaceH[i]);
    buildEquipment(g, kind, ex, tops[i], ez, ew, eh, ed, (o.x * 1000 + i) | 0);
  });
}

function buildScreen(g, o, ctx) {
  const { w, h } = o;
  const top = o.z + h, casingH = ctx.casingH, casingBottom = o.casing_z ?? (ctx.H - casingH);
  const casing = new THREE.Group(); g.add(casing); casing.userData.fixed = true;
  box(casing, MAT.offWhite, -0.1, casingBottom - o.z, -0.05, w + 0.2, casingH, 0.11 + o.d, 0.02); // 幕盒（局部 y 相對於幕底）
  const drop = new THREE.Group(); drop.position.y = top - o.z; g.add(drop); // 以畫面頂為錨點
  const fabric = new THREE.Group(); drop.add(fabric);
  box(fabric, MAT.screen, 0, -h, 0, w, h, Math.max(0.004, o.d), 0, false);
  const bar = 0.03; box(fabric, MAT.black, 0, -h, 0, w, bar, Math.max(0.006, o.d), 0, false);
  const extra = casingBottom - top; // 幕盒底至畫面頂的黑邊（如為負數，即畫面頂已高於幕盒底）
  if (extra > 0.001) box(fabric, MAT.black, 0, 0, 0, w, extra, Math.max(0.004, o.d), 0, false);
  ctx.screenDrop = fabric;
}

function buildAquariumTank(g, o) {

  box(g, MAT.soil, gl, gl, gl, w - 2 * gl, soil, d - 2 * gl, 0, false);

  const rock = new THREE.DodecahedronGeometry(1, 0);

}

  [['#btn-dims', state.dims], ['#btn-tri', state.tri], ['#btn-beam', state.beam], ['#btn-unc', state.unc], ['#btn-planA', state.plan === 'A'], ['#btn-planB', state.plan === 'B'], ['#btn-screen', state.screenDown], ['#btn-walk', state.walk]]

function updateScreen(dt) {
  const target = state.screenDown ? 1 : 0;
  state.screenT += Math.sign(target - state.screenT) * Math.min(Math.abs(target - state.screenT), dt * 0.6);
  if (ctx.screenDrop) { ctx.screenDrop.scale.y = Math.max(0.001, state.screenT); ctx.screenDrop.visible = state.screenT > 0.002; }
}

/* ------------------------------ 點選物件 ------------------------------ */
let selHelper = null;
// 平面圖的「左／右」以站在飯廳望向窗為準；坐在梳化望向喇叭時方向相反，故另作說明
function sideNote(o) {
  const lp = getO(ctx.data, 'listening_position'), sp = getO(ctx.data, 'speaker_left'); if (!lp || !sp || !/^(speaker|rack)/.test(o.id)) return '';
  const f = DIRV[facingOf(sp)], fx = -f[0], fz = -f[1], c = ctr(o), dot = (c.x - lp.x) * -fz + (c.y - lp.y) * fx;
  if (Math.abs(dot) < 0.02) return '';
  return `<div class="row"><span class="k">由聆聽位望向喇叭</span><span class="v">位於${dot > 0 ? '右' : '左'}手邊</span></div>`;
}
function showInfo(o, g) {

  if (g) { const b = new THREE.Box3().setFromObject(g); selHelper = new THREE.Box3Helper(b, 0x4fc3f7); scene.add(selHelper); }
  const z = o.z || 0, el = $('#info');
  el.innerHTML = `<button class="close" aria-label="關閉">×</button><h4>${esc(o.name)}${o.confirmed === false ? '<span class="tag u">未確認</span>' : '<span class="tag c">已確認</span>'}</h4>
    ${o.type === 'point' ? `<div class="row"><span class="k">位置</span><span class="v">x ${o.x}・y ${o.y}・z ${o.z} m</span></div>` : `
    <div class="row"><span class="k">尺寸（闊 × 深 × 高）</span><span class="v">${cm(o.w)} × ${cm(o.d)} × ${cm(o.h)} cm</span></div>
    <div class="row"><span class="k">X（闊度）</span><span class="v">${fmt(o.x, 3)} – ${fmt(o.x + o.w, 3)} m</span></div>
    <div class="row"><span class="k">Y（由窗起計）</span><span class="v">${fmt(o.y, 3)} – ${fmt(o.y + o.d, 3)} m</span></div>
    <div class="row"><span class="k">Z（高度）</span><span class="v">${fmt(z, 3)} – ${fmt(z + o.h, 3)} m</span></div>${sideNote(o)}`}
    ${o.material ? `<p class="note">${esc(o.material)}</p>` : ''}${o.contents ? `<p class="note">器材：${esc(o.contents)}</p>` : ''}${o.note ? `<p class="note">備註：${esc(o.note)}</p>` : ''}`;
  el.style.display = 'block';
  el.querySelector('.close').onclick = () => { el.style.display = 'none'; if (selHelper) { scene.remove(selHelper); selHelper = null; } };
}
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', (e) => { downAt = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!downAt || Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 6) return;
  const r = renderer.domElement.getBoundingClientRect(); ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(pickables, true).find((h) => h.object.visible && !h.object.isSprite);
  if (!hit) return; let o = hit.object; while (o && !o.userData.obj) o = o.parent;
  if (o) showInfo(o.userData.obj, o);
});

/* ------------------------------ 第一身行走 ------------------------------ */
const EYE = 1.6, walk = { yaw: Math.PI, pitch: 0, keys: new Set(), joy: { x: 0, y: 0 }, look: null };
function toggleWalk(on) {
  state.walk = on; controls.enabled = !on;
  $('#joy').style.display = on && matchMedia('(pointer: coarse)').matches ? 'block' : 'none';
  $('#walkhint').style.display = on ? 'block' : 'none';
  $('#walkhint').textContent = matchMedia('(pointer: coarse)').matches ? '左下搖桿移動，在畫面拖動轉向。視線高度 1.6 m。' : 'W A S D／方向鍵移動，按住 Shift 加速；拖動滑鼠轉向。視線高度 1.6 m。';
  if (on) {
    const d = ctx.data, W = d.room.width_x, L = d.room.length_y;
    // 由「由飯廳望」視角的位置出發（如有），面向窗
    const dv = views.find((v) => /飯廳/.test(v.name)), sx = dv ? dv.pos.x : W / 2, sz = dv ? dv.pos.z : L - 0.5;
    const p = new THREE.Vector3(Math.min(W - 0.3, Math.max(0.3, sx)), EYE, Math.min(L - 0.3, Math.max(0.3, sz)));
    if (collides(p.x, p.z)) p.set(W / 2, EYE, L - 0.3);
    camera.position.copy(p); walk.yaw = 0; walk.pitch = -0.1; camera.fov = 65; camera.updateProjectionMatrix();
  } else { camera.fov = 50; camera.updateProjectionMatrix(); setView(currentView); }
  applyToggles();
}
function collides(x, z) {
  const r = 0.18, W = ctx.W, L = ctx.L;
  if (x < r || x > W - r || z < r || z > L - r) return true;
  return walkColliders.some((a) => x > a.x0 - r && x < a.x1 + r && z > a.y0 - r && z < a.y1 + r);
}
function updateWalk(dt) {
  if (!state.walk) return;
  let f = 0, s = 0; const k = walk.keys;
  if (k.has('KeyW') || k.has('ArrowUp')) f += 1; if (k.has('KeyS') || k.has('ArrowDown')) f -= 1;
  if (k.has('KeyD') || k.has('ArrowRight')) s += 1; if (k.has('KeyA') || k.has('ArrowLeft')) s -= 1;
  f += -walk.joy.y; s += walk.joy.x;
  const speed = (k.has('ShiftLeft') || k.has('ShiftRight') ? 2.4 : 1.3) * dt;
  const fx = -Math.sin(walk.yaw), fz = -Math.cos(walk.yaw), rx = Math.cos(walk.yaw), rz = -Math.sin(walk.yaw);
  const dx = (fx * f + rx * s) * speed, dz = (fz * f + rz * s) * speed, p = camera.position;
  if (!collides(p.x + dx, p.z)) p.x += dx; if (!collides(p.x, p.z + dz)) p.z += dz;
  p.y = EYE; camera.quaternion.setFromEuler(new THREE.Euler(walk.pitch, walk.yaw, 0, 'YXZ'));
}
addEventListener('keydown', (e) => { if (state.walk) { walk.keys.add(e.code); if (e.code.startsWith('Arrow')) e.preventDefault(); } });
addEventListener('keyup', (e) => walk.keys.delete(e.code));
addEventListener('blur', () => walk.keys.clear());
renderer.domElement.addEventListener('pointerdown', (e) => { if (state.walk) { walk.look = { x: e.clientX, y: e.clientY, id: e.pointerId }; } });
addEventListener('pointermove', (e) => {
  if (!state.walk || !walk.look || e.pointerId !== walk.look.id) return;
  walk.yaw -= (e.clientX - walk.look.x) * 0.004; walk.pitch = Math.max(-1.3, Math.min(1.3, walk.pitch - (e.clientY - walk.look.y) * 0.004));
  walk.look.x = e.clientX; walk.look.y = e.clientY;
});
addEventListener('pointerup', (e) => { if (walk.look && e.pointerId === walk.look.id) walk.look = null; });
(() => {
  const j = $('#joy'), knob = j.querySelector('i'); let id = null;
  const move = (e) => { const r = j.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2; let x = (e.clientX - cx) / (r.width / 2), y = (e.clientY - cy) / (r.height / 2); const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; } walk.joy = { x, y }; knob.style.transform = `translate(${x * 35}px,${y * 35}px)`; };
  j.addEventListener('pointerdown', (e) => { id = e.pointerId; j.setPointerCapture(id); move(e); e.stopPropagation(); });
  j.addEventListener('pointermove', (e) => { if (e.pointerId === id) move(e); });
  const end = (e) => { if (e.pointerId !== id) return; id = null; walk.joy = { x: 0, y: 0 }; knob.style.transform = ''; };
  j.addEventListener('pointerup', end); j.addEventListener('pointercancel', end);
})();

/* ------------------------------ 截圖 ------------------------------ */
const shotURLs = [];
// 下載：在 claude.ai Artifact 內經 downloads 功能（會先請你確認）；其他情況用一般下載連結
let dlNS;
async function downloadsNS() {
  if (dlNS !== undefined) return dlNS;
  try { dlNS = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch { dlNS = null; }
  return dlNS;
}
async function saveFile(blob, filename, href) {
  const ns = await downloadsNS();
  if (ns) {
    try { await ns.save({ filename, data: blob }); return true; }
    catch (e) { if (e && e.code === 'rate_limited') { $('#shots-msg').textContent = '已有一個下載確認視窗未處理，請先完成。'; } return false; }
  }
  const a = document.createElement('a'); a.href = href; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); return true;
}
function capture(list) {
  const [W, H] = $('#sel-res').value.split('x').map(Number), clean = $('#chk-clean').checked;
  const prev = { pr: renderer.getPixelRatio(), size: renderer.getSize(new THREE.Vector2()), pos: camera.position.clone(), q: camera.quaternion.clone(), tgt: controls.target.clone(), fov: camera.fov, aspect: camera.aspect };
  const vis = ['dims', 'tri', 'beam', 'unc'].map((k) => [k, groups[k].visible]);
  if (clean) vis.forEach(([k]) => (groups[k].visible = false));
  if (selHelper) selHelper.visible = false;
  renderer.setPixelRatio(1); renderer.setSize(W, H, false); camera.aspect = W / H;
  const out = [];
  list.forEach((v) => {
    if (v) { camera.position.copy(v.pos); camera.fov = fovFor(v); camera.lookAt(v.tgt); }
    camera.updateProjectionMatrix(); renderer.render(scene, camera);
    out.push({ name: v ? v.name : '目前畫面', url: renderer.domElement.toDataURL('image/png') });
    if (!v) { /* 目前畫面：不改相機 */ }
  });
  vis.forEach(([k, s]) => (groups[k].visible = s)); if (selHelper) selHelper.visible = true;
  renderer.setPixelRatio(prev.pr); renderer.setSize(prev.size.x, prev.size.y, false);
  camera.position.copy(prev.pos); camera.quaternion.copy(prev.q); controls.target.copy(prev.tgt); camera.fov = prev.fov; camera.aspect = prev.aspect; camera.updateProjectionMatrix();
  return out.map((s) => ({ ...s, W, H }));
}
async function showShots(shots) {
  shotURLs.splice(0).forEach((u) => URL.revokeObjectURL(u));
  const date = new Date().toISOString().slice(0, 10), plan = '橫向' + state.plan;
  const items = await Promise.all(shots.map(async (s) => { const blob = await (await fetch(s.url)).blob(); const u = URL.createObjectURL(blob); shotURLs.push(u); return { ...s, blob, href: u, file: `客廳_${s.name}_${plan}_${date}.png` }; }));
  $('#shots').innerHTML = items.map((s, i) => `<figure><img src="${s.href}" alt="${esc(s.name)}"><figcaption><span>${esc(s.name)}</span><button data-i="${i}" style="min-height:0;padding:3px 9px">下載 PNG</button></figcaption></figure>`).join('');
  $('#shots').querySelectorAll('button[data-i]').forEach((btn) => btn.onclick = () => { const s = items[+btn.dataset.i]; saveFile(s.blob, s.file, s.href); });
  $('#shots-msg').textContent = `解像度 ${shots[0].W}×${shots[0].H}；${$('#chk-clean').checked ? '已隱藏尺寸及未確認標示' : '包括目前開啟的標示'}。手機可長按圖片儲存。`;
  $('#shots-all').onclick = async () => { for (const s of items) { const ok = await saveFile(s.blob, s.file, s.href); if (!ok && dlNS) break; await new Promise((r) => setTimeout(r, 350)); } };
  $('#shots-dlg').classList.add('show');
}

function rebuildKeepCamera() {
  const pos = camera.position.clone(), tgt = controls.target.clone(), wasSofa = /梳化/.test(views[currentView]?.name || '');
  rebuild();
  if (wasSofa && !state.walk) setView(currentView); else { camera.position.copy(pos); controls.target.copy(tgt); }
  state.screenT = state.screenDown ? 1 : 0; updateScreen(0);
}

/* ------------------------------ 主迴圈 ------------------------------ */
function resize() { const w = viewport.clientWidth, h = viewport.clientHeight; if (!w || !h) return; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(viewport);
const clock = new THREE.Clock();

try {
  buildTextures(); buildMaterials();
  state.data = await loadData();
  rebuild(); resize(); setView(0);
  $('#boot').style.display = 'none';
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.1);
    updateScreen(dt); updateWalk(dt); if (!state.walk) controls.update();
    renderer.render(scene, camera);
  });
  window.__app = { state, setView, capture, analysis: () => analysis, views: () => views, toggleWalk, rebuildKeepCamera };
} catch (e) {
  console.error(e); $('#boot').style.display = 'flex'; $('#boot').textContent = `載入失敗：${e.message}`;
}
